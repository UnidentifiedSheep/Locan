name: Publish NuGet packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 1.0.0 or 1.0.0-preview.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            PACKAGE_VERSION="${TAG_NAME#v}"
          else
            PACKAGE_VERSION="$INPUT_VERSION"
          fi

          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "value=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Locan.sln --disable-parallel

      - name: Build and test
        run: >-
          dotnet test Locan.sln
          --configuration Release
          --no-restore
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true

      - name: Pack public packages
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          projects=(
            "src/Locan.Core/Locan.Core.csproj"
            "src/Locan/Locan.csproj"
            "src/Locan.Hosting/Locan.Hosting.csproj"
            "src/Locan.AspNetCore/Locan.AspNetCore.csproj"
            "src/Locan.Roslyn/Generator/Locan.Generator/Locan.Generator/Locan.Generator.csproj"
          )

          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              --output artifacts/packages \
              -p:PackageVersion="$PACKAGE_VERSION" \
              -p:ContinuousIntegrationBuild=true
          done

      - name: Verify generator package in a clean project
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          smoke_directory="$RUNNER_TEMP/locan-package-smoke"
          dotnet new classlib --framework net10.0 --output "$smoke_directory"

          cat > "$smoke_directory/locan-package-smoke.csproj" <<XML
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <LocanDefaultCulture>en</LocanDefaultCulture>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="Locan.Generator" Version="$PACKAGE_VERSION" />
              <LocanResource Include="localization-en.json"
                             GenerateMessages="true"
                             CopyToOutput="false" />
            </ItemGroup>
          </Project>
          XML

          cat > "$smoke_directory/localization-en.json" <<'JSON'
          {
            "culture": "en",
            "messages": {
              "package.smoke.test": "Package {Version|String} works."
            }
          }
          JSON

          cat > "$smoke_directory/Class1.cs" <<'CSHARP'
          using Locan.Generator.Attributes;

          [assembly: LocalizationModule("Locan.PackageSmoke")]

          namespace Locan.PackageSmoke;

          public static class SmokeTest
          {
              public static PackageSmokeTestMessage Create(string version) =>
                  PackageSmokeTestMessage.Create(version);
          }
          CSHARP

          dotnet restore "$smoke_directory" \
            --source "$GITHUB_WORKSPACE/artifacts/packages" \
            --source https://api.nuget.org/v3/index.json
          dotnet build "$smoke_directory" --configuration Release --no-restore
          test ! -e "$smoke_directory/bin/Release/net10.0/Locan/localization-en.json"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.value }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
